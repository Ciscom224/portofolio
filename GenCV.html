<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GenCV</title>
  <style>
    /* --- STYLE GLOBAL --- */
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0f172a; /* Bleu nuit très profond */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      user-select: none; /* Empêche la sélection de texte en tapant frénétiquement */
      -webkit-touch-callout: none;
    }

    #gameCanvas {
      display: block; width: 100%; height: 100%;
    }

    /* --- INTERFACE UTILISATEUR --- */
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; /* Laisse passer les clics vers le canvas */
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }

    /* Bannière Maintenance */
    .maintenance-banner {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      color: #f59e0b; /* Jaune/Orange warning */
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
      text-transform: uppercase;
    }

    /* Score en haut */
    .hud {
      position: absolute; top: 50px; width: 100%; text-align: center;
      color: white; text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .score-text { font-size: 4rem; font-weight: 900; line-height: 1; margin: 0;}
    .high-score { font-size: 1rem; color: #94a3b8; font-weight: bold; letter-spacing: 2px;}

    /* Écrans de menu (Début et Game Over) */
    .menu {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 40px; border-radius: 20px; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      pointer-events: auto; /* Réactive les clics pour le menu */
      transition: opacity 0.3s ease;
      max-width: 90%;
    }

    .hidden { opacity: 0; pointer-events: none; }

    .menu h1 {
      margin: 0 0 15px 0; color: white; font-size: 2.2rem; letter-spacing: 1px;
    }
    .menu h1 span { color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
    
    .menu p { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 30px; line-height: 1.5; }
    .menu strong { color: #10b981; }

    .btn-play {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white; border: none; padding: 15px 40px; font-size: 1.1rem;
      font-weight: bold; border-radius: 50px; cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-play:active { transform: scale(0.95); }

    /* Signature Mamadou */
    .signature {
      position: absolute; bottom: 20px; color: #475569; font-size: 0.8rem; font-weight: bold;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    
    <div class="maintenance-banner">🚧 Site en maintenance 🚧</div>

    <div class="hud">
      <div id="currentScore" class="score-text">0</div>
      <div class="high-score">RECORD : <span id="highScore">0</span></div>
    </div>

    <div id="startMenu" class="menu">
      <h1>MODE <span>MAINTENANCE</span></h1>
<p>J'adapte actuellement le site pour de nouveaux secteurs.<br>En attendant, <strong>protégez le noyau du serveur !</strong><br><br>👉 <strong>Cliquez ou touchez l'écran</strong> pour<br>inverser la rotation du pare-feu.</p>      <button class="btn-play" onclick="startGame()">LANCER L'ANTIVIRUS</button>
    </div>

    <div class="signature">Développé par Mamadou Cissé</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startMenu = document.getElementById('startMenu');
    const scoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');

    // Variables globales
    let w, h, cx, cy;
    let animationId;
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('orbitalHighScore') || 0;
    highScoreEl.innerText = highScore;

    // Redimensionnement dynamique
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cx = w / 2;
      cy = h / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- OBJETS DU JEU ---

    // 1. Le Noyau Central (Le joueur doit le protéger)
    const core = {
      radius: 25,
      draw: function() {
        let pulse = Math.sin(Date.now() / 200) * 3; // Effet de battement de coeur
        ctx.beginPath();
        ctx.arc(cx, cy, this.radius + pulse, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc'; // Blanc
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffffff';
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
      }
    };

    // 2. Le Bouclier (Le joueur le contrôle)
    const shield = {
      radius: 80,
      angle: 0,
      arcLength: Math.PI * 0.75, // Longueur de l'arc (environ 135 degrés)
      direction: 1, // 1 = Horaire, -1 = Anti-horaire
      speed: 0.06,
      draw: function() {
        this.angle += this.speed * this.direction;
        
        ctx.beginPath();
        ctx.arc(cx, cy, this.radius, this.angle - this.arcLength/2, this.angle + this.arcLength/2);
        ctx.strokeStyle = '#3b82f6'; // Bleu Tech
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#3b82f6';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    };

    // 3. Les Virus (Ennemis)
    let hazards = [];
    let hazardSpawnRate = 100; // Plus c'est bas, plus ça spawn vite
    let frameCount = 0;
    let hazardBaseSpeed = 2.5;

    class Hazard {
      constructor() {
        this.radius = 10;
        // Fait apparaître l'ennemi loin en dehors de l'écran
        let spawnAngle = Math.random() * Math.PI * 2;
        let spawnDist = Math.max(w, h) / 2 + 50;
        this.x = cx + Math.cos(spawnAngle) * spawnDist;
        this.y = cy + Math.sin(spawnAngle) * spawnDist;
        
        // Vitesse qui augmente avec le score
        this.speed = hazardBaseSpeed + (score * 0.15);
        
        // Calcule le vecteur direction vers le centre
        let dx = cx - this.x;
        let dy = cy - this.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        this.vx = (dx / dist) * this.speed;
        this.vy = (dy / dist) * this.speed;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444'; // Rouge Danger
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ef4444';
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      update(index) {
        this.x += this.vx;
        this.y += this.vy;
        this.draw();

        // Distance par rapport au centre
        let distToCenter = Math.sqrt((this.x - cx)**2 + (this.y - cy)**2);

        // A. VÉRIFIER LA COLLISION AVEC LE BOUCLIER
        if (distToCenter <= shield.radius + this.radius + 5 && distToCenter >= shield.radius - this.radius - 5) {
          // Calculer l'angle du virus
          let hazardAngle = Math.atan2(this.y - cy, this.x - cx);
          
          // Normaliser les angles entre 0 et 2 PI pour comparer
          let normShieldAngle = shield.angle % (Math.PI * 2);
          if (normShieldAngle < 0) normShieldAngle += Math.PI * 2;
          if (hazardAngle < 0) hazardAngle += Math.PI * 2;

          let diff = Math.abs(hazardAngle - normShieldAngle);
          if (diff > Math.PI) diff = Math.PI * 2 - diff; // Le chemin le plus court

          // Si l'angle du virus est dans la largeur du bouclier
          if (diff < shield.arcLength / 2 + 0.1) {
            // DEFLECTED ! (Score)
            createExplosion(this.x, this.y, '#3b82f6');
            hazards.splice(index, 1);
            score++;
            scoreEl.innerText = score;
            
            // Animation du score
            scoreEl.style.transform = 'scale(1.3)';
            setTimeout(() => scoreEl.style.transform = 'scale(1)', 100);
            return; // On arrête là pour ce virus
          }
        }

        // B. VÉRIFIER LA COLLISION AVEC LE NOYAU (GAME OVER)
        if (distToCenter < core.radius + this.radius) {
          gameOver();
        }
      }
    }

    // 4. Particules d'explosion (pour le fun visuel)
    let particles = [];
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        this.size = Math.random() * 4 + 2;
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1; // 100% d'opacité
      }
      update(index) {
        this.x += this.vx; this.y += this.vy;
        this.life -= 0.05; // Fade out
        if (this.life <= 0) {
          particles.splice(index, 1);
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(59, 130, 246, ${this.life})`; // Toujours bleu pour les explosions
          ctx.fill();
        }
      }
    }

    function createExplosion(x, y) {
      for(let i=0; i<15; i++) {
        particles.push(new Particle(x, y));
      }
    }

    // --- GESTION DES CLICS (LE SEUL CONTROLE DU JEU) ---
    function handleInput() {
      if (gameState === 'PLAYING') {
        shield.direction *= -1; // Inverse la direction
      }
    }
    window.addEventListener('mousedown', handleInput);
    window.addEventListener('touchstart', handleInput, {passive: false});

    // --- BOUCLE PRINCIPALE ---
    function animate() {
      if (gameState !== 'PLAYING') return;

      animationId = requestAnimationFrame(animate);

      // Fond avec léger fondu (crée l'effet de trainée)
      ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
      ctx.fillRect(0, 0, w, h);

      // Dessiner le centre et le bouclier
      core.draw();
      shield.draw();

      // Gestion des ennemis
      frameCount++;
      // Plus le score monte, plus ça spawn vite (minimum toutes les 20 frames)
      let currentSpawnRate = Math.max(20, hazardSpawnRate - score * 2); 
      if (frameCount % currentSpawnRate === 0) {
        hazards.push(new Hazard());
      }

      // Update des ennemis (à l'envers pour ne pas bugger avec le splice)
      for (let i = hazards.length - 1; i >= 0; i--) {
        hazards[i].update(i);
      }

      // Update des particules
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(i);
      }
    }

    // --- LOGIQUE D'ÉTAT DU JEU ---
    function startGame() {
      gameState = 'PLAYING';
      startMenu.classList.add('hidden');
      score = 0;
      scoreEl.innerText = score;
      hazards = [];
      particles = [];
      frameCount = 0;
      shield.angle = 0;
      
      ctx.clearRect(0, 0, w, h); // Nettoie l'écran
      animate();
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      cancelAnimationFrame(animationId);
      
      // Explosion rouge finale
      ctx.fillStyle = 'rgba(239, 68, 68, 0.5)';
      ctx.fillRect(0, 0, w, h);

      // Gestion du High Score
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('orbitalHighScore', highScore);
        highScoreEl.innerText = highScore;
      }

      // Afficher le menu avec délai
      setTimeout(() => {
        startMenu.querySelector('h1').innerHTML = "SERVEUR <span>CRASHÉ</span>";
        startMenu.querySelector('p').innerHTML = `Bugs détruits : <strong>${score}</strong><br>Record : ${highScore}<br><br>Encore une partie en attendant ?`;
        startMenu.querySelector('button').innerText = "RELANCER LE SERVEUR";
        startMenu.classList.remove('hidden');
      }, 500);
    }
    
    // On dessine juste le fond au début
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, w, h);

  </script>
</body>
</html>
